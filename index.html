<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보험 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0f1115;--surface1:#171a20;--surface2:#1e232b;--border:#2a3038;--border-strong:#3a4149;--text1:#edf0f3;--text2:#aab3c0;--text3:#8a94a3;
--mint:#4ade9a;--mint-dim:#1f3a2c;--gold:#e8b04b;--gold-dim:#3a2f18;--blue:#5b9bd5;--blue-dim:#1c2c3a;--red:#e2635a;--divider-gray:#3a4149;--mark:#6b5a12;
--ins0:#e57373;--ins1:#7e8ce0;--ins2:#4db6ac;--ins3:#ba68c8;--ins4:#f08a4b;--ins5:#81c784;

html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body.light-theme{--bg:#fff;--surface1:#fff;--surface2:#f7f8fa;--border:#f0f1f3;--border-strong:#e5e7eb;--text1:#191f28;--text2:#444f5d;--text3:#6b7684;
--mint:#178a5c;--mint-dim:#e6f7f0;--gold:#a8720f;--gold-dim:#fbf3e2;--blue:#2f6fb0;--blue-dim:#eaf3fb;--red:#c33a2f;--divider-gray:#f2f2f2;--mark:#fde68a;
--ins0:#cf4a4a;--ins1:#4a5bc4;--ins2:#1f8a80;--ins3:#9a3fb0;--ins4:#d36a1f;--ins5:#3f8f45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;transition:background .15s,color .15s;padding-bottom:60px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-family:'Roboto',sans-serif;letter-spacing:-.4px}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 0}
.app-title{font-size:26px;font-weight:700;color:var(--text1);letter-spacing:-.5px}
.theme-icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border-strong);color:var(--text2);border-radius:10px;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}

.owner-tabs{display:flex;gap:8px;padding:16px 20px 0}
.owner-tab,.range-tab{text-align:center;border:1px solid var(--border);background:var(--surface1);color:var(--text2);cursor:pointer;font-weight:500}
.owner-tab{flex:1;padding:10px 0;border-radius:10px;font-size:14px}
.range-tab{padding:6px 12px;border-radius:8px;font-size:12px;white-space:nowrap;flex:none}
.owner-tab.active,.range-tab.active{background:var(--mint-dim);border-color:var(--mint);color:var(--mint)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 4px}
.metric{background:var(--surface1);border:1px solid var(--border);border-radius:12px;padding:14px}
.metric.full{grid-column:1/-1}
.metric .label{font-size:12px;color:var(--text2);margin-bottom:6px}
.metric .value{font-size:19px;font-weight:500}
.metric .sub{font-size:12px;color:var(--text3);margin-top:2px}
.panel-wrap{padding:0 20px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 20px 4px}
.search{width:100%;height:42px;background:var(--surface2);border:1px solid var(--border-strong);border-radius:10px;padding:0 14px;font-size:15px}
.search::placeholder{color:var(--text3)}
.scroll-row{display:flex;gap:6px;overflow-x:auto;padding:10px 20px 2px;scrollbar-width:none}
.scroll-row::-webkit-scrollbar{display:none}
.vtabs{display:flex;gap:6px;padding:10px 20px 14px}
.vtabs .range-tab{flex:1}
.divider{height:12px;background:var(--divider-gray)}
.panel-title{font-size:22px;font-weight:700;margin:22px 0 4px;display:flex;justify-content:space-between;align-items:center}
.panel-caption{font-size:11.5px;color:var(--text3);margin-bottom:10px}
.empty{font-size:13px;color:var(--text3);padding:28px 0;text-align:center}
.acc{margin:0 -20px;padding:0 20px;background:var(--surface1);border-left:4px solid var(--ic,var(--border-strong));border-bottom:12px solid var(--divider-gray)}
.acc:last-child{border-bottom:0}
.idot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ic,var(--text3));margin-right:6px;vertical-align:1px}
.acc-ins{font-size:17px;font-weight:700;color:var(--text1);letter-spacing:-.3px}
.acc-head{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0;cursor:pointer;width:100%;background:var(--surface1);border:0;border-bottom:1px solid var(--border);text-align:left;color:inherit}
.acc-name{font-size:13px;font-weight:400;color:var(--text2);margin-top:3px}
.acc-sub{font-size:12px;color:var(--text3);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acc-right{text-align:right;flex:none;display:flex;gap:6px;align-items:center}
.acc-prem{font-size:17px}.acc-prem small{display:block;font-size:11px;color:var(--text3);font-family:inherit;letter-spacing:0}
.chev{transition:transform .15s;color:var(--text3)}
.acc.open .chev{transform:rotate(180deg)}
.acc.exp .acc-name,.acc.exp .acc-prem{color:var(--text2)}
.acc-body{display:none;padding:12px 0 20px}
.acc.open .acc-body{display:block}
.badge{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid currentColor;font-weight:500}
.owner-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);padding:0 0 6px}
.owner-row select{background:var(--surface2);border:1px solid var(--border-strong);border-radius:7px;height:32px;padding:0 8px;font-size:13px}
.note{font-size:11.5px;color:var(--text3);margin:2px 0 6px}
.gt{font-size:13px;font-weight:600;color:var(--mint);margin:16px 0 2px}
details.it{border-bottom:1px solid var(--border)}
details.it:last-child{border-bottom:0}
details.it summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer}

.nm{flex:1;min-width:0;font-size:15px}.nm small{display:block;font-size:11.5px;color:var(--text3);margin-top:3px}
.am{text-align:right;font-size:15px;font-weight:500;flex:none}.am small{font-size:11.5px;color:var(--text3);font-weight:400;font-family:inherit}
.rn{color:var(--gold);font-weight:500;margin-left:6px}
.nm small .rn:first-child{margin-left:0}
.dsc-det+.dsc-meta{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-strong)}
.mr{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--text2)}
.mr+.mr{margin-top:6px}
.mr b{font-weight:500;color:var(--text1);text-align:right}
.dsc .dl{display:flex;gap:8px;align-items:flex-start}
.dsc .dl+.dl{margin-top:3px}
.bd{flex:none;width:4px;height:4px;border-radius:50%;background:var(--text3);margin-top:8px}
.dsc{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:12.5px;color:var(--text2);line-height:1.6}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.bk{padding:14px 0;border-bottom:1px dashed var(--border)}

.bk-u{font-size:11.5px;color:var(--text3);font-weight:400;margin-left:2px}

.fill{height:100%;width:var(--w,0%);border-radius:3px;background:var(--c,var(--mint))}

.json-panel{display:block;margin-top:6px}

textarea{width:100%;height:260px;margin:8px 0;background:var(--surface2);border:1px solid var(--border-strong);border-radius:8px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px}

.btn-ghost{background:none;border:1px solid var(--border-strong)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--border-strong);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>

  if(eok) o.push(eok.toLocaleString()+'억');

function renderStats(){

}
const nz = t => String(t||'').replace(/갱신형|[\s·.\-()\[\]]/g,'');

  const r = nz(i.rider), n = nz(i.name);
  if(!r || r.includes(n) || n.includes(r)) return true;

}

function curTerm(rn){
  const [y, m, d] = rn.from.split('.').map(Number), t = new Date(); t.setHours(0, 0, 0, 0);
  const at = k => new Date(y + k*rn.years, m - 1, d);

}
function applyRenewals(){

function payLeft(pay){

}
const SUBS = {
  '사망/장해':['질병 사망','질병 후유장해','상해 사망','상해 후유장해','교통상해 사망·후유장해 (교통사고 시 추가)'],
  '암':['암 진단비 (일반암)','고액암 진단비','소액암·유사암 진단비','암 수술비','상피내암·경계성종양 수술비','암 입원비','상피내암·경계성종양 입원비'],
  '뇌':['뇌졸중 진단비','뇌혈관질환 진단비','양성뇌종양 진단비'],
  '심장':['급성심근경색증 진단비','허혈성심질환 진단비','특정심혈관질환 진단비'],
  '수술':['뇌혈관질환 수술비','허혈성심질환 수술비','성인 8대 특정질환 수술비','질병·재해 수술비 (3종 기준)','조혈모세포이식 수술비','5대장기 이식 수술비','각막 이식 수술비','충수염 수술비','컴퓨터질환(VDT증후군) 수술비','상해 흉터 복원 수술비'],
  '입원/통원':['질병 입원 의료비 (실손)','상해 입원 의료비 (실손)','질병 통원 의료비 [외래]','질병 통원 의료비 [처방조제]','상해 통원 의료비 [외래]','상해 통원 의료비 [처방조제]','질병·재해 입원비','성인 8대 특정질환 입원비'],
  '상해/재해':['골절 진단비','화상 진단비','깁스 치료비','교통재해 입원 (4일 이상)','재해 장기 입원 (31일 이상)']
};
function subTotals(p, sub){
  let total = 0; const parts = [];
  D.policies.filter(x => live(x) && x.owner === p.id && (st.i === 'all' || x.insurer === st.i)).forEach(pol => {
    const g = {}; let sum = 0;
    pol.items.forEach(i => { if(!(i.subs||[]).includes(sub)) return; if(i.group) g[i.group] = Math.max(g[i.group]||0, i.amount); else sum += i.amount; });
    sum += Object.values(g).reduce((a, b) => a + b, 0);
    if(sum){ total += sum; parts.push(`<i class="idot" style="--ic:${insColor(pol.insurer)}"></i>${esc(pol.insurer)} ${won(sum)}`); }
  });
  return {total, parts};
}
function subUnit(sub){
  for(const pol of D.policies) for(const i of pol.items) if((i.subs||[]).includes(sub)) return UNIT[i.unit] || '';
  return '';
}
function tagHtml(t, people){
  const rows = SUBS[t].map(k => ({k, r: people.map(p => subTotals(p, k))})).filter(x => x.r.some(y => y.total));
  if(!rows.length) return '';
  return `<div class="bk"><div class="bk-title">${t}</div>${rows.map(({k, r}) => {
    const mx = Math.max(1, ...r.map(y => y.total)), u = subUnit(k);
    return `<div class="bk-sub">${esc(k)}</div>` + people.map((p, n) => { const y = r[n];
      return `<div class="bk-line"><div class="bk-top"><div class="bk-name">${esc(p.name)}<small>${y.total ? y.parts.join(' · ') : '보장 없음'}</small></div><div class="bk-amt num">${y.total ? won(y.total) + (u ? `<small class="bk-u">${u}</small>` : '') : '-'}</div></div><div class="track"><div class="fill" style="--w:${y.total/mx*100}%;--c:${col(p)}"></div></div></div>`; }).join('');
  }).join('')}</div>`;
}
function renderCmp(){
  const people = D.people.filter(p => st.p === 'all' || p.id === st.p);
  const rows = TAGS.filter(t => SUBS[t] && (st.t === 'all' || st.t === t)).map(t => tagHtml(t, people)).join('');
  return `<div class="panel-title"><span>보장 비교</span></div><div class="panel-caption">세부 보장별 합계예요. 같은 사람의 여러 계약은 합산하고, 금액 아래에 계약별 내역을 보여줘요. 부부 합산이 아니라 사람별 비교이고 만기된 계약은 제외했어요. 한도·일당·회당은 금액 옆에 표시했어요. 대한종신 장해는 1급 기준이고, 45세 이후 최초 진단 시 1.5배 지급은 적용해서 계산했고, 재해 상황별로 다른 지급액은 그중 최대로 계산했어요.</div>${rows || '<div class="empty">비교할 보장이 없어요.</div>'}`;
}
function render(){ renderStats(); $('out').innerHTML = st.v === 'cmp' ? renderCmp() : renderIns(); }
const syncJson = () => { $('js').value = JSON.stringify(D, null, 2); };
function all(){ applyRenewals(); renderChips(); render(); syncJson(); }

$('q').addEventListener('input', e => { st.q = e.target.value; render(); });
document.body.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.p){ st.p = d.p; renderChips(); render(); }
  else if(d.i){ st.i = d.i; renderChips(); render(); }
  else if(d.t){ st.t = d.t; renderChips(); render(); }
  else if(d.v){ st.v = d.v; renderChips(); render(); }
  else if(d.pol){ flip.has(d.pol) ? flip.delete(d.pol) : flip.add(d.pol); render(); }
});
$('out').addEventListener('change', e => {
  const id = e.target.dataset.own; if(!id) return;
  D.policies.find(p => p.id === id).owner = e.target.value; save(); all(); toast('가입자를 바꿨어요');
});
$('ap').onclick = () => {
  try{
    const j = JSON.parse($('js').value);
    if(!Array.isArray(j.people) || !Array.isArray(j.policies)) throw new Error('people와 policies가 필요해요');
    j.version = j.version || SEED.version; D = j; save(); all(); toast('JSON 데이터를 적용했어요');
  }catch(err){ toast('JSON 오류: ' + err.message); }
};
$('cp').onclick = async () => {
  try{ await navigator.clipboard.writeText($('js').value); toast('클립보드에 복사했어요'); }
  catch(e){ $('js').select(); toast('선택된 내용을 직접 복사해 주세요'); }
};
$('rs').onclick = () => { D = JSON.parse(JSON.stringify(SEED)); save(); st = {p:'all', i:'all', q:'', t:'all', v:'ins'}; $('q').value = ''; all(); toast('기본값으로 되돌렸어요'); };

let light = false;
try{ const t = localStorage.getItem(TKEY); light = t === 'light'; }catch(e){}
const SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
const MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
function theme(){ document.body.classList.toggle('light-theme', light); $('th').innerHTML = light ? MOON : SUN; $('th').setAttribute('aria-label', light ? '다크 모드로 전환' : '라이트 모드로 전환'); }
$('th').onclick = () => { light = !light; theme(); try{ localStorage.setItem(TKEY, light ? 'light' : 'dark'); }catch(e){} };
theme(); all();
</script>
