  }).join('');

  return btns + `<div class="panel-title"><span>${esc(sit.k)}</span></div><div class="panel-caption">이 상황에서 받을 수 있는 보장을 보험사별로 모았어요. 실제 지급 여부와 금액은 약관, 진단 내용, 가입 후 경과 기간(감액 기간 등)에 따라 달라요.</div>${head}${groups || '<div class="empty">해당하는 보장이 없어요.</div>'}`;
}
function render(){
  renderStats(); renderDash();
  $('tg').style.display = $('sb').style.display = st.v === 'sit' ? 'none' : '';
  $('out').innerHTML = st.v === 'cmp' ? renderCmp() : st.v === 'sit' ? renderSit() : renderIns();
}
function all(){ applyRenewals(); renderChips(); render(); }

$('q').addEventListener('input', e => { st.q = e.target.value; render(); });
document.body.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.sit){ st.sit = d.sit; render(); }
  else if(d.goSit){ st.v = 'sit'; st.sit = d.goSit; renderChips(); render(); $('out').scrollIntoView(); }
  else if(d.p){ st.p = d.p; renderChips(); render(); }
  else if(d.i){ st.i = d.i; renderChips(); render(); }
  else if(d.t){ st.t = d.t; renderChips(); render(); }
  else if(d.v){ st.v = d.v; renderChips(); render(); }
  else if(d.pol){ flip.has(d.pol) ? flip.delete(d.pol) : flip.add(d.pol); render(); }
});
document.body.addEventListener('click', e => {
  const w = e.target.closest('.bk-amtw');
  document.querySelectorAll('.bk-amtw.open').forEach(x => { if(x !== w){ x.classList.remove('open'); x.firstElementChild.setAttribute('aria-expanded', 'false'); } });
  if(w && e.target.closest('.bk-amt')){ const o = w.classList.toggle('open'); w.firstElementChild.setAttribute('aria-expanded', String(o)); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.bk-amtw.open').forEach(x => x.classList.remove('open')); });
let light = false;
try{ const t = localStorage.getItem(TKEY); light = t === 'light'; }catch(e){}
const SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
const MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
function theme(){ document.body.classList.toggle('light-theme', light); $('th').innerHTML = light ? MOON : SUN; $('th').setAttribute('aria-label', light ? '다크 모드로 전환' : '라이트 모드로 전환'); }
$('th').onclick = () => { light = !light; theme(); try{ localStorage.setItem(TKEY, light ? 'light' : 'dark'); }catch(e){} };
theme(); all();
function setStk(){ document.documentElement.style.setProperty('--stk', $('stk').offsetHeight + 'px'); }
setStk();
if(typeof window !== 'undefined'){ window.addEventListener('resize', setStk); window.addEventListener('load', setStk); }
if(typeof ResizeObserver !== 'undefined') new ResizeObserver(setStk).observe($('stk'));
</script>
</body>
